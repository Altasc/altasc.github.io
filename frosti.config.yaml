      - href: "https://x.com/althenesc"
        ariaLabel: X(twitter)
        title: X(twitter)
        svg: "ri:twitter-x-line"
      - href: "https://space.bilibili.com/456134934"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "mailto:althenesc@outlook.com" # 链接
        ariaLabel: Email # 图标的可访问性标签
        title: Email # 图标的悬浮标题
        svg: "lucide:mail"
